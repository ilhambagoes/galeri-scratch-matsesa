<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Upload Game Scratch</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="admin-wrapper">
        <div class="admin-card">
            <h2>📤 Upload Game Scratch</h2>
            <p class="subtitle">Unggah file .sb3 karya murid ke galeri kelas.</p>

            <form id="upload-form">
                <div class="form-group">
                    <label for="game_title">Judul Game</label>
                    <input type="text" id="game_title" placeholder="Contoh: Petualangan Kucing" required>
                </div>

                <div class="form-group">
                    <label for="student_name">Nama Murid</label>
                    <input type="text" id="student_name" placeholder="Contoh: Budi Santoso" required>
                </div>

                <div class="form-group">
                    <label for="student_class">Kelas</label>
                    <input type="text" id="student_class" placeholder="Contoh: 7A / 8B" required>
                </div>

                <div class="form-group">
                    <label for="sb3_file">File Proyek Scratch (.sb3)</label>
                    <input type="file" id="sb3_file" accept=".sb3" required>
                </div>

                <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%;">Upload ke Galeri</button>
            </form>

            <a href="index.html" class="back-link">← Kembali ke Galeri Utama</a>
        </div>
    </div>

    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/app.js"></script>
</body>
</html>
