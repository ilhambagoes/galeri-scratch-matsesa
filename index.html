<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri Game Scratch Murid</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <header class="header">
            <div>
                <h1>🎮 Galeri Karya Scratch MTsN 10 Sleman 📹</h1>
                <p>Kumpulan karya scratch interaktif buatan murid-murid MTsN 10 Sleman.</p>
            </div>
            <a href="admin.html" class="btn btn-primary">+ Upload Karya (Guru)</a>
        </header>

        <!-- Tempat daftar karya muncul -->
        <main id="game-list" class="game-grid">
            <p>Memuat daftar karya...</p>
        </main>
    </div>

    <!-- Modal Pop-up untuk Main Karya -->
    <div id="player-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Judul Karya</h2>
                <button id="close-modal-btn" class="close-btn">&times;</button>
            </div>
            <div class="iframe-wrapper">
                <iframe id="turbowarp-iframe" src="" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="components.js"></script>
    <script src="app.js"></script>
</body>
</html>
